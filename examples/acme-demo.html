<!doctype html>
<meta charset="utf-8">
<title>Acme Launchpad</title>
<style>
  :root{--ink:#14161f;--mute:#6b7280;--line:#e5e7ef;--blue:#2f6bff;--green:#12b76a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"SF Pro Display",Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f6fb}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 44px;background:#fff;border-bottom:1px solid var(--line)}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.02em}.logo b{color:var(--blue)}
  nav{display:flex;gap:28px;color:var(--mute);font-size:16px}nav .on{color:var(--ink);font-weight:600}
  main{max-width:980px;margin:34px auto;padding:0 28px;display:grid;grid-template-columns:1.25fr 1fr;gap:26px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 1px 2px #0001}
  h1{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}p.sub{margin:0 0 22px;color:var(--mute);font-size:17px}
  label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:18px 0 8px}
  input{width:100%;height:56px;font-size:20px;padding:0 18px;border:2px solid var(--line);border-radius:12px;outline:none;font-family:inherit}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 5px #2f6bff22}
  .plans{display:flex;gap:12px}.plan{flex:1;padding:14px 16px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-weight:600}
  .plan small{display:block;color:var(--mute);font-weight:500;margin-top:2px}.plan.sel{border-color:var(--blue);background:#2f6bff0d}
  button{margin-top:26px;width:100%;height:64px;font-size:22px;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:14px;cursor:pointer;transition:transform .12s,background .2s}
  button:active{transform:scale(.98)}button.done{background:var(--green)}
  .stat{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px}
  .stat:last-child{border:0}.stat b{font-size:26px;letter-spacing:-.02em}
  #toast{margin-top:18px;padding:16px 18px;border-radius:12px;background:#12b76a14;border:1px solid #12b76a55;color:#067647;font-weight:600;font-size:18px;opacity:0;transform:translateY(6px);transition:all .35s}
  #toast.on{opacity:1;transform:none}
  .secret{font-family:ui-monospace,Menlo,monospace;background:#f1f3f9;padding:3px 8px;border-radius:6px;font-size:16px}
</style>
<header><div class="logo">acme<b>.</b>launchpad</div><nav><span class="on">Projects</span><span>Analytics</span><span>Team</span><span>Billing</span></nav></header>
<main>
  <section class="card">
    <h1>Publish a project</h1><p class="sub">Name it, pick a plan, go live in one click.</p>
    <label>Project name</label><input id="project" placeholder="e.g. Spring launch">
    <label>Plan</label>
    <div class="plans"><div class="plan">Starter<small>$0 / month</small></div><div class="plan sel">Team<small>$29 / month</small></div><div class="plan">Scale<small>$99 / month</small></div></div>
    <button id="go">Publish</button>
    <div id="toast"></div>
  </section>
  <aside class="card">
    <h1 style="font-size:22px">This week</h1><p class="sub" style="font-size:15px">Across all projects</p>
    <div class="stat"><span>Visitors</span><b>12,840</b></div>
    <div class="stat"><span>Sign-ups</span><b>1,284</b></div>
    <div class="stat"><span>Conversion</span><b>10.0%</b></div>
    <div class="stat"><span>API key</span><span class="secret">sk_live_9f2a71c4e8</span></div>
  </aside>
</main>
<script>
  const field = document.getElementById('project'), toast = document.getElementById('toast'), go = document.getElementById('go');
  go.onclick = () => { toast.textContent = `✓ “${field.value || 'Untitled'}” is live`; toast.classList.add('on'); go.classList.add('done'); go.textContent = 'Published'; };
</script>
