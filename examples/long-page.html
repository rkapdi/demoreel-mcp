<!doctype html>
<meta charset="utf-8">
<title>demoreel long page</title>
<style>
  body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f5f6fa;color:#1c1e26}
  section{height:420px;margin:24px;border-radius:18px;display:grid;place-items:center;font-size:54px;font-weight:700;color:#fff}
</style>
<script>
  const colours = ['#0a84ff', '#34c759', '#ff9500', '#af52de', '#ff2d55', '#5b86e5', '#134e5e', '#f83600'];
  colours.forEach((c, i) => document.write(`<section style="background:${c}">Section ${i + 1} of ${colours.length}</section>`));
</script>
